<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>混雑状況管理ページ</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="background: #4f6b64;">
  <header>
    <h1>混雑状況切替画面</h1>
  </header>

  <section class="admin">
    <label for="statusSelect">混雑状況を選択：</label>
    <select id="statusSelect">
      <option value="green">空いてる</option>
      <option value="yellow">やや混雑</option>
      <option value="red">混雑中</option>
    </select>
    <button onclick="updateStatus()">混雑状況を反映</button>
  </section>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/konzatudo.js"></script>
</body>
</html>
